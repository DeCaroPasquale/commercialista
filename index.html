<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Studio De Caro — Scopri i servizi più adatti alla tua attività</title>
  <style>
:root {
  --navy: #0b2838;
  --navy2: #123e52;
  --teal: #14758c;
  --teal2: #dff3f7;
  --bg: #eef4f6;
  --paper: #fff;
  --ink: #14242d;
  --muted: #637582;
  --line: #d7e3e8;
  --soft: #f6f9fa;
  --good: #087054;
  --goodbg: #e9f8f2;
  --warn: #8a5900;
  --warnbg: #fff7e7;
  --bad: #9c3030;
  --badbg: #fff0f0;
  --shadow: 0 16px 44px rgba(10,39,54,.12);
  --r: 19px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background: var(--bg);
  color: var(--ink);
}

button,input,select,textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.appHeader {
  background: linear-gradient(120deg,#071722,var(--navy) 56%,var(--teal));
  color: #fff;
  padding: 22px clamp(18px,5vw,64px);
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: 0 8px 24px rgba(0,0,0,.16);
}

.headInner {
  max-width: 1440px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.waterLogo {
  width: 52px;
  height: 52px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-weight: 950;
  font-size: 1.2rem;
  background: rgba(255,255,255,.08);
}

.brand h1 {
  font-size: clamp(1.05rem,2vw,1.45rem);
  margin: 0;
}

.brand p {
  margin: 3px 0 0;
  color: #cce8ef;
  font-size: .84rem;
}

.headActions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  border: 0;
  border-radius: 13px;
  padding: 10px 14px;
  font-weight: 850;
  background: var(--navy);
  color: #fff;
  box-shadow: 0 5px 16px rgba(11,40,56,.13);
}

.btn:hover {
  filter: brightness(1.05);
}

.btn:active {
  transform: translateY(1px);
}

.btn.secondary {
  background: var(--teal);
}

.btn.light {
  background: #fff;
  color: var(--navy);
  border: 1px solid var(--line);
  box-shadow: none;
}

.btn.soft {
  background: var(--teal2);
  color: var(--navy);
  box-shadow: none;
}

.btn.warn {
  background: var(--warnbg);
  color: var(--warn);
  box-shadow: none;
  border: 1px solid #efd8a5;
}

.btn.danger {
  background: var(--badbg);
  color: var(--bad);
  box-shadow: none;
  border: 1px solid #efc4c4;
}

.btn:disabled {
  opacity: .42;
  cursor: not-allowed;
  filter: none;
}

.main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 28px clamp(16px,4vw,54px) 64px;
}

.welcome {
  min-height: calc(100vh - 115px);
  display: grid;
  place-items: center;
}

.welcomeCard {
  width: min(940px,100%);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: clamp(24px,5vw,52px);
}

.kicker {
  font-size: .76rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--teal);
  font-weight: 900;
}

.welcome h2 {
  font-size: clamp(2rem,5vw,4.2rem);
  line-height: 1;
  margin: 8px 0 18px;
}

.lead {
  color: var(--muted);
  font-size: 1.08rem;
  line-height: 1.6;
  max-width: 760px;
}

.choiceGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 28px;
}

.choice {
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--soft);
  text-align: left;
}

.choice strong {
  display: block;
  font-size: 1.18rem;
  margin-bottom: 8px;
}

.choice span {
  color: var(--muted);
  line-height: 1.45;
}

.choice:hover {
  border-color: #71b8c8;
  background: #eff9fb;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0,1fr) 390px;
  gap: 22px;
  align-items: start;
}

.stack {
  display: grid;
  gap: 18px;
}

.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: 0 9px 28px rgba(10,39,54,.07);
  overflow: hidden;
}

.panelHead {
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(#fff,#fbfdfe);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}

.panelHead h2,.panelHead h3 {
  margin: 0;
}

.panelHead p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: .9rem;
}

.panelBody {
  padding: 20px;
}

.formGrid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 13px;
}

.field {
  display: block;
}

.field.full {
  grid-column: 1/-1;
}

.field>span {
  display: block;
  font-size: .79rem;
  font-weight: 900;
  color: #294251;
  margin: 0 0 6px;
}

.field input,.field select,.field textarea,.chatComposer textarea,.searchInput {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  background: #fff;
  color: var(--ink);
  outline: none;
}

.field textarea {
  min-height: 76px;
  resize: vertical;
}

.field input:focus,.field select:focus,.field textarea:focus,.chatComposer textarea:focus,.searchInput:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(20,117,140,.13);
}

.help {
  font-size: .76rem;
  color: var(--muted);
  display: block;
  margin-top: 5px;
  line-height: 1.35;
}

.toolbar {
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
}

.searchInput {
  flex: 1;
  min-width: 230px;
}

.section {
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
}

.section+ .section {
  margin-top: 12px;
}

.section summary {
  list-style: none;
  cursor: pointer;
}

.section summary::-webkit-details-marker {
  display: none;
}

.sectionTitle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 15px 17px;
  background: #f6fafb;
}

.sectionTitle strong {
  font-size: 1rem;
}

.countPill {
  font-size: .75rem;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--teal2);
  color: var(--navy);
  font-weight: 900;
}

.service {
  padding: 16px 17px;
  border-top: 1px solid var(--line);
}

.service.selected {
  background: #fbfeff;
}

.serviceTop {
  display: flex;
  gap: 11px;
  align-items: flex-start;
}

.serviceTop input[type=checkbox] {
  width: 20px;
  height: 20px;
  accent-color: var(--teal);
  margin-top: 2px;
}

.serviceName {
  font-weight: 900;
}

.serviceDesc {
  font-size: .84rem;
  color: var(--muted);
  line-height: 1.45;
  margin: 7px 0 0;
}

.serviceEditor {
  margin-top: 14px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--soft);
}

.calcGrid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 9px;
  margin-top: 12px;
}

.metric {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  padding: 10px;
}

.metric span {
  display: block;
  color: var(--muted);
  font-size: .73rem;
  font-weight: 850;
  text-transform: uppercase;
}

.metric strong {
  display: block;
  margin-top: 4px;
}

.proposedBox {
  margin-top: 12px;
  padding: 13px;
  border-radius: 14px;
  background: #fff;
  border: 1px solid var(--line);
}

.proposedGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.issue {
  margin-top: 9px;
  padding: 9px 11px;
  border-radius: 11px;
  background: var(--warnbg);
  color: var(--warn);
  font-size: .82rem;
  font-weight: 750;
  line-height: 1.4;
}

.summary {
  position: sticky;
  top: 102px;
}

.totalHero {
  padding: 18px;
  border-radius: 17px;
  background: linear-gradient(135deg,var(--navy),var(--teal));
  color: #fff;
  margin-bottom: 12px;
}

.totalHero span {
  display: block;
  color: #cdebf2;
  font-size: .8rem;
  font-weight: 850;
}

.totalHero strong {
  font-size: 2rem;
  display: block;
  margin-top: 4px;
}

.totalHero small {
  display: block;
  color: #d9edf2;
  margin-top: 6px;
}

.miniTotals {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 12px;
}

.miniTotal {
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--soft);
}

.miniTotal span {
  display: block;
  font-size: .72rem;
  color: var(--muted);
  font-weight: 850;
}

.miniTotal strong {
  display: block;
  margin-top: 4px;
}

.periodList {
  display: grid;
  gap: 7px;
  margin: 12px 0;
}

.periodRow {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
  font-size: .88rem;
}

.lineList {
  max-height: 320px;
  overflow: auto;
  display: grid;
  gap: 8px;
}

.line {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
}

.line b {
  font-size: .86rem;
}

.line small {
  display: block;
  color: var(--muted);
  margin-top: 3px;
  line-height: 1.35;
}

.gate {
  padding: 12px;
  border-radius: 14px;
  margin-bottom: 12px;
}

.gate.good {
  background: var(--goodbg);
  color: var(--good);
  border: 1px solid #bee8d8;
}

.gate.warn {
  background: var(--warnbg);
  color: var(--warn);
  border: 1px solid #efd8a5;
}

.gate.bad {
  background: var(--badbg);
  color: var(--bad);
  border: 1px solid #efc4c4;
}

.gate strong {
  display: block;
}

.gate small {
  display: block;
  margin-top: 4px;
  line-height: 1.4;
}

.actionsGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}

.privacyBox {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--soft);
  margin-top: 12px;
}

.privacyBox label {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  font-size: .84rem;
  font-weight: 750;
}

.privacyBox input {
  margin-top: 3px;
  accent-color: var(--teal);
}

.chatShell {
  display: grid;
  grid-template-rows: auto minmax(330px,1fr) auto;
  min-height: 680px;
}

.chatHeader {
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(135deg,#f5fbfc,#fff);
}

.chatHeader h2 {
  margin: 0;
}

.chatHeader p {
  margin: 5px 0 0;
  color: var(--muted);
}

.messages {
  padding: 20px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #f7fafb;
}

.bubble {
  max-width: 86%;
  padding: 12px 14px;
  border-radius: 16px;
  line-height: 1.48;
  white-space: pre-wrap;
}

.bubble.bot {
  align-self: flex-start;
  background: #fff;
  border: 1px solid var(--line);
  border-bottom-left-radius: 5px;
}

.bubble.user {
  align-self: flex-end;
  background: var(--navy);
  color: #fff;
  border-bottom-right-radius: 5px;
}

.chatComposer {
  padding: 15px;
  border-top: 1px solid var(--line);
  background: #fff;
}

.chatComposer textarea {
  min-height: 90px;
  resize: vertical;
}

.questionBatch {
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #fff;
  margin-top: 10px;
}

.questionBatch h3 {
  margin: 0 0 5px;
}

.questionBatch>p {
  color: var(--muted);
  margin: 0 0 14px;
}

.question {
  margin-top: 12px;
}

.question label.qLabel {
  display: block;
  font-weight: 850;
  font-size: .88rem;
  margin-bottom: 6px;
}

.question>input,.question>select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 11px;
  background: #fff;
  color: var(--ink);
}

.checkGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.checkOption {
  display: flex;
  gap: 7px;
  align-items: flex-start;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: .82rem;
}

.confirmGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.confirmCard {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 13px;
  background: var(--soft);
}

.confirmCard h4 {
  margin: 0 0 8px;
}

.confirmCard ul {
  margin: 0;
  padding-left: 18px;
  font-size: .86rem;
  line-height: 1.45;
}

.clientCover {
  background: linear-gradient(130deg,var(--navy),var(--teal));
  color: #fff;
  border-radius: 24px;
  padding: 32px;
  margin-bottom: 18px;
}

.clientCover .watermark {
  opacity: .18;
  font-size: 4rem;
  font-weight: 950;
  float: right;
}

.clientCover h2 {
  font-size: 2.2rem;
  margin: 8px 0;
}

.clientCards {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
}

.clientCard {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
}

.clientCard span {
  display: block;
  color: var(--muted);
  font-size: .76rem;
  font-weight: 850;
  text-transform: uppercase;
}

.clientCard strong {
  display: block;
  margin-top: 5px;
}

.clientItems {
  margin-top: 18px;
}

.clientItem {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 18px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}

.clientItem h4 {
  margin: 0;
}

.clientItem p {
  margin: 5px 0 0;
  color: var(--muted);
  line-height: 1.4;
}

.clientPrice {
  font-weight: 950;
  white-space: nowrap;
}

.modalBackdrop {
  position: fixed;
  inset: 0;
  background: rgba(4,20,29,.6);
  display: grid;
  place-items: center;
  padding: 18px;
  z-index: 100;
}

.modal {
  width: min(720px,100%);
  max-height: 92vh;
  overflow: auto;
  background: #fff;
  border-radius: 22px;
  box-shadow: 0 30px 80px rgba(0,0,0,.3);
}

.modalHead {
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.modalHead h3 {
  margin: 0;
}

.modalBody {
  padding: 20px;
}

.modal textarea {
  width: 100%;
  min-height: 260px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  resize: vertical;
}

.modalActions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 15px 20px;
  border-top: 1px solid var(--line);
}

.statusToast {
  position: fixed;
  right: 18px;
  bottom: 18px;
  max-width: 420px;
  padding: 12px 15px;
  border-radius: 13px;
  background: var(--navy);
  color: #fff;
  box-shadow: var(--shadow);
  z-index: 150;
}

.wizardShell {
  display: grid;
  gap: 18px;
}

.wizardTop {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: 0 9px 28px rgba(10,39,54,.07);
  padding: 16px;
}

.wizardSteps {
  display: grid;
  grid-template-columns: repeat(5,minmax(0,1fr));
  gap: 8px;
}

.wizardStep {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 11px 10px;
  background: var(--soft);
  color: var(--muted);
  font-weight: 850;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 9px;
}

.wizardStep:hover {
  border-color: #71b8c8;
}

.wizardStep.current {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

.wizardStep.complete:not(.current) {
  background: var(--goodbg);
  color: var(--good);
  border-color: #bee8d8;
}

.wizardNumber {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background: rgba(20,117,140,.12);
  font-size: .76rem;
  flex: 0 0 auto;
}

.wizardStep.current .wizardNumber {
  background: rgba(255,255,255,.18);
}

.wizardStep.complete:not(.current) .wizardNumber {
  background: #fff;
}

.wizardNav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding-top: 4px;
}

.wizardNavRight {
  display: flex;
  gap: 8px;
}

.presetGrid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 10px;
}

.presetCard {
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--soft);
  padding: 14px;
  text-align: left;
  color: var(--ink);
}

.presetCard:hover {
  border-color: #71b8c8;
  background: #eff9fb;
}

.presetCard.active {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(20,117,140,.12);
  background: #eff9fb;
}

.presetCard strong {
  display: block;
}

.presetCard small {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  line-height: 1.35;
}

.presetNotice {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--teal2);
  color: var(--navy);
  font-size: .82rem;
  font-weight: 750;
}

.vatFieldGroup {
  display: grid;
  grid-template-columns: minmax(0,1fr) 210px;
  gap: 8px;
}

.vatFieldGroup input:disabled {
  background: #edf2f4;
  color: var(--muted);
}

.emptyStep {
  padding: 28px;
  border: 1px dashed #9eb7c2;
  border-radius: 16px;
  background: var(--soft);
  text-align: center;
  color: var(--muted);
}

.previewNote {
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--teal2);
  color: var(--navy);
  font-size: .86rem;
  line-height: 1.45;
}

.manualPreview .clientCover {
  margin-bottom: 12px;
}

.manualPreview .clientCards {
  margin-bottom: 12px;
}

.mobileSummary {
  display: none;
}

#printRoot {
  display: none;
}

@media (max-width:1050px) {
  .workspace {
    grid-template-columns: 1fr;
  }
  .summary {
    position: static;
  }
  .clientCards {
    grid-template-columns: 1fr 1fr;
  }
  .mobileSummary {
    display: flex;
    position: sticky;
    bottom: 8px;
    z-index: 15;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 15px;
    background: var(--navy);
    color: #fff;
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
  }
}

@media (max-width:900px) {
  .wizardSteps {
    grid-template-columns: repeat(5,1fr);
  }
  .wizardStep {
    justify-content: center;
  }
  .wizardStep span:last-child {
    display: none;
  }
  .presetGrid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width:680px) {
  .appHeader {
    position: static;
  }
  .headInner {
    align-items: flex-start;
    flex-direction: column;
  }
  .choiceGrid,.formGrid,.proposedGrid,.confirmGrid,.clientCards {
    grid-template-columns: 1fr;
  }
  .main {
    padding: 18px 12px 55px;
  }
  .panelBody {
    padding: 15px;
  }
  .calcGrid {
    grid-template-columns: 1fr;
  }
  .checkGrid {
    grid-template-columns: 1fr;
  }
  .actionsGrid {
    grid-template-columns: 1fr;
  }
  .clientCover {
    padding: 23px;
  }
  .clientItem {
    grid-template-columns: 1fr;
  }
  .summary {
    top: 0;
  }
  .presetGrid {
    grid-template-columns: 1fr;
  }
  .vatFieldGroup {
    grid-template-columns: 1fr;
  }
  .wizardTop {
    padding: 10px;
  }
  .wizardSteps {
    gap: 5px;
  }
  .wizardStep {
    padding: 9px 5px;
  }
  .wizardNav {
    align-items: stretch;
    flex-direction: column;
  }
  .wizardNavRight {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
  }
  .wizardNav>.btn {
    width: 100%;
  }
}

@media print {
  @page {
    size: A4;
    margin: 10mm;
  }
  body {
    background: #fff !important;
  }
  body>*:not(#printRoot) {
    display: none !important;
  }
  #printRoot {
    display: block !important;
    color: #14242d;
    font-family: Arial,sans-serif;
  }
  .printDoc {
    font-size: 9.5pt;
    line-height: 1.38;
  }
  .printHeader {
    padding: 9mm;
    border-radius: 7mm;
    background: linear-gradient(120deg,#0b2838,#14758c) !important;
    color: #fff !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    display: flex;
    justify-content: space-between;
    gap: 10mm;
  }
  .printHeader h1 {
    font-size: 23pt;
    margin: 2mm 0;
  }
  .printHeader p {
    margin: 0;
    color: #d9edf2 !important;
  }
  .printLogo {
    font-size: 26pt;
    font-weight: 900;
    opacity: .25;
  }
  .printSection {
    border: 1px solid #d7e3e8;
    border-radius: 5mm;
    padding: 5mm;
    margin-top: 5mm;
    break-inside: auto;
  }
  .printSection h2 {
    font-size: 14pt;
    color: #0b2838;
    margin: 0 0 4mm;
    border-bottom: 1px solid #d7e3e8;
    padding-bottom: 2.5mm;
  }
  .printInfoGrid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 3mm;
  }
  .printInfo {
    background: #f6f9fa;
    border: 1px solid #d7e3e8;
    border-radius: 3mm;
    padding: 3mm;
  }
  .printInfo span {
    display: block;
    font-size: 7.5pt;
    color: #637582;
    text-transform: uppercase;
    font-weight: bold;
  }
  .printInfo strong {
    display: block;
    margin-top: 1mm;
  }
  .printTotal {
    background: #0b2838 !important;
    color: #fff !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    border-radius: 4mm;
    padding: 5mm;
    text-align: center;
  }
  .printTotal span {
    display: block;
    color: #cdebf2 !important;
  }
  .printTotal strong {
    font-size: 22pt;
  }
  .printItem {
    border: 1px solid #d7e3e8;
    border-left: 3mm solid #14758c;
    border-radius: 3mm;
    padding: 3.5mm;
    margin-bottom: 3mm;
    break-inside: avoid;
  }
  .printItemTop {
    display: flex;
    justify-content: space-between;
    gap: 5mm;
  }
  .printItem h3 {
    margin: 0;
    font-size: 11pt;
  }
  .printItem p {
    margin: 1.5mm 0 0;
    color: #526673;
  }
  .printPrice {
    font-size: 12pt;
    font-weight: bold;
    white-space: nowrap;
  }
  .printTechnical {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 2mm;
    margin-top: 2mm;
  }
  .printTechCell {
    background: #f6f9fa;
    border-radius: 2mm;
    padding: 2mm;
  }
  .printTechCell span {
    display: block;
    font-size: 7pt;
    color: #637582;
  }
  .printCondition {
    padding: 3mm;
    background: #f6f9fa;
    border-radius: 3mm;
    margin: 2mm 0;
  }
  .signatureGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12mm;
    margin-top: 14mm;
  }
  .signature {
    border-top: 1px solid #14242d;
    padding-top: 2mm;
    text-align: center;
  }
  .draftWatermark {
    position: fixed;
    inset: 40% 0 auto;
    text-align: center;
    font-size: 52pt;
    font-weight: 900;
    color: rgba(156,48,48,.13);
    transform: rotate(-22deg);
    z-index: 20;
  }
  .pageBreak {
    break-before: page;
  }
  .printSmall {
    font-size: 8pt;
    color: #637582;
  }
  .printFooter {
    text-align: center;
    margin-top: 5mm;
    font-size: 7.5pt;
    color: #637582;
  }
}

/* Client assistant and portal */
/*Studio De Caro — Assistente conversazionale cliente*/

:root {
  --assistant-max: 1120px;
}

html,body {
  max-width: 100%;
  overflow-x: hidden;
}

#app,.main,.panel,.messages,.chatComposer {
  min-width: 0;
  max-width: 100%;
}

.portalBadge {
  display: inline-flex;
  align-items: center;
  padding: 8px 11px;
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 999px;
  background: rgba(255,255,255,.1);
  font-size: .8rem;
  font-weight: 900;
}

.portalWelcome .welcomeCard {
  max-width: 1040px;
}

.roleGrid {
  align-items: stretch;
}

.roleChoice {
  position: relative;
  min-height: 185px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  transition: .18s ease;
}

.roleChoice:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(10,39,54,.10);
}

.roleIcon {
  display: block;
  font-size: 2rem;
  margin-bottom: 12px;
}

.passwordCard {
  max-width: 620px !important;
}

.passwordForm {
  display: grid;
  gap: 14px;
  margin-top: 24px;
}

.assistantLayout {
  display: grid;
  grid-template-columns: minmax(235px,290px) minmax(0,1fr);
  gap: 20px;
  align-items: start;
  width: 100%;
  max-width: var(--assistant-max);
  margin: auto;
  min-width: 0;
}

.assistantLayout>* {
  min-width: 0;
}

.assistantSidebar {
  position: sticky;
  top: 102px;
  max-height: calc(100vh - 130px);
  overflow: hidden;
}

.assistantSidebar .panelHead {
  padding: 16px;
}

.assistantAreas {
  display: grid;
  gap: 7px;
  max-height: calc(100vh - 245px);
  overflow: auto;
  padding: 0 2px 4px;
}

.assistantArea {
  width: 100%;
  display: grid;
  grid-template-columns: 28px minmax(0,1fr);
  gap: 8px;
  text-align: left;
  align-items: center;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
  font-weight: 800;
}

.assistantArea small {
  grid-column: 2;
  color: var(--muted);
  font-size: .7rem;
  font-weight: 700;
}

.assistantArea.active,.assistantArea:hover {
  background: var(--teal2);
  border-color: #83c2cf;
}

.assistantPanel {
  display: grid;
  grid-template-rows: auto minmax(360px,1fr) auto auto;
  min-height: calc(100vh - 155px);
  overflow: hidden;
}

.assistantHeader {
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(135deg,#f5fbfc,#fff);
}

.assistantHeader h2 {
  margin: 0;
}

.assistantHeader p {
  margin: 5px 0 0;
  color: var(--muted);
  line-height: 1.45;
}

.assistantData {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fff;
  padding: 10px 12px;
}

.assistantData summary {
  cursor: pointer;
  font-weight: 850;
  color: var(--navy);
}

.assistantData .formGrid {
  margin-top: 12px;
}

.assistantMessages {
  padding: 18px 20px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #f7fafb;
  min-height: 360px;
  scroll-behavior: smooth;
}

.assistantBubble {
  max-width: min(88%,760px);
  padding: 11px 14px;
  border-radius: 16px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.assistantBubble.bot {
  align-self: flex-start;
  background: #fff;
  border: 1px solid var(--line);
  border-bottom-left-radius: 5px;
}

.assistantBubble.user {
  align-self: flex-end;
  background: var(--navy);
  color: #fff;
  border-bottom-right-radius: 5px;
}

.assistantBubble.compact {
  padding: 9px 12px;
  font-size: .92rem;
}

.assistantTyping {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.assistantTypingDots {
  display: inline-flex;
  gap: 4px;
}

.assistantTypingDots i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--teal);
  animation: assistantDot 1.1s infinite ease-in-out;
}

.assistantTypingDots i:nth-child(2) {
  animation-delay: .14s;
}

.assistantTypingDots i:nth-child(3) {
  animation-delay: .28s;
}

@keyframes assistantDot {
  0%,60%,100% {
    transform: translateY(0);
    opacity: .4;
  }
  30% {
    transform: translateY(-3px);
    opacity: 1;
  }
}

.assistantChoices {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}

.assistantChoice {
  border: 1px solid #94cbd6;
  border-radius: 999px;
  background: #eff9fb;
  color: var(--navy);
  padding: 7px 11px;
  font-size: .78rem;
  font-weight: 850;
}

.assistantChoice:hover {
  background: var(--teal2);
}

.assistantQuote {
  align-self: flex-start;
  width: min(100%,780px);
  border: 1px solid #b9dce4;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 8px 22px rgba(11,40,56,.07);
  overflow: hidden;
}

.assistantQuote.superseded {
  box-shadow: none;
  border-style: dashed;
  background: #fbfdfe;
}

.assistantQuoteSummary {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
}

.assistantQuoteSummary span {
  display: block;
  color: var(--muted);
  font-size: .72rem;
  font-weight: 850;
  text-transform: uppercase;
}

.assistantQuoteSummary strong {
  display: block;
  margin-top: 2px;
  font-size: 1.35rem;
  color: var(--navy);
}

.assistantQuoteSummary small {
  display: block;
  color: var(--muted);
  margin-top: 3px;
  line-height: 1.35;
}

.assistantQuoteStatus {
  padding: 5px 8px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--muted);
  font-size: .68rem;
  font-weight: 900;
  white-space: nowrap;
}

.assistantQuoteDelta {
  margin: 0 14px 10px;
  padding: 8px 10px;
  border-radius: 11px;
  background: var(--goodbg);
  color: var(--good);
  font-size: .8rem;
  font-weight: 800;
}

.assistantQuoteDelta.up {
  background: var(--warnbg);
  color: var(--warn);
}

.assistantQuoteBody {
  padding: 0 14px 13px;
}

.assistantAssumption {
  font-size: .83rem;
  color: #334c59;
  line-height: 1.45;
}

.assistantTags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 9px;
}

.assistantTag {
  padding: 4px 7px;
  border-radius: 999px;
  background: var(--teal2);
  color: var(--navy);
  font-size: .68rem;
  font-weight: 800;
}

.assistantQuote details {
  margin-top: 10px;
  border-top: 1px solid var(--line);
  padding-top: 9px;
}

.assistantQuote summary {
  cursor: pointer;
  color: var(--teal);
  font-size: .78rem;
  font-weight: 900;
}

.assistantBreakdown {
  display: grid;
  gap: 6px;
  margin-top: 8px;
}

.assistantBreakdownRow {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--line);
  font-size: .78rem;
}

.assistantBreakdownRow:last-child {
  border-bottom: 0;
}

.assistantBreakdownRow small {
  display: block;
  color: var(--muted);
  margin-top: 2px;
}

.assistantContextGrid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 6px;
  margin-top: 8px;
}

.assistantContextCell {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 7px 8px;
  background: var(--soft);
  font-size: .74rem;
}

.assistantContextCell span {
  display: block;
  color: var(--muted);
  font-size: .65rem;
  text-transform: uppercase;
  font-weight: 850;
}

.assistantContextCell b {
  display: block;
  margin-top: 2px;
}

.assistantEdit {
  border: 0;
  background: transparent;
  color: var(--teal);
  font-size: .68rem;
  font-weight: 900;
  padding: 3px 0;
}

.assistantScope {
  margin-top: 9px;
  padding: 8px 9px;
  border-radius: 10px;
  background: var(--warnbg);
  color: #78551a;
  font-size: .72rem;
  line-height: 1.4;
}

.assistantQuoteActions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.assistantQuoteActions button {
  padding: 7px 9px;
  font-size: .72rem;
}

.assistantFeedback {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

.assistantFeedback>span {
  color: var(--muted);
  font-size: .7rem;
  margin-right: 3px;
}

.assistantFeedback button {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 5px 8px;
  font-size: .68rem;
  color: var(--ink);
}

.assistantFeedback button.selected {
  background: var(--teal2);
  border-color: #83c2cf;
  color: var(--navy);
  font-weight: 850;
}

.assistantSuggestions {
  padding: 10px 15px;
  border-top: 1px solid var(--line);
  background: #fbfdfe;
  overflow: hidden;
}

.assistantSuggestions>span {
  display: block;
  font-size: .7rem;
  font-weight: 900;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 7px;
}

.assistantChipRow {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}

.assistantChip {
  flex: 0 0 auto;
  max-width: 270px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--navy);
  padding: 7px 10px;
  font-size: .74rem;
  font-weight: 800;
  white-space: normal;
  text-align: left;
  line-height: 1.25;
}

.assistantChip:hover {
  background: var(--teal2);
  border-color: #83c2cf;
}

.assistantComposer {
  padding: 12px 15px;
  border-top: 1px solid var(--line);
  background: #fff;
}

.assistantComposer textarea {
  width: 100%;
  min-height: 72px;
  max-height: 180px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 10px 12px;
  outline: none;
}

.assistantComposer textarea:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(20,117,140,.13);
}

.assistantComposerMeta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: .68rem;
  margin: 6px 2px 9px;
}

.assistantComposerActions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.assistantComposerActions .btn {
  padding: 9px 13px;
}

.assistantNewMessages {
  position: absolute;
  left: 50%;
  bottom: 118px;
  transform: translateX(-50%);
  z-index: 5;
  border: 0;
  border-radius: 999px;
  background: var(--navy);
  color: #fff;
  padding: 7px 11px;
  font-weight: 850;
  box-shadow: var(--shadow);
}

.assistantFinalPanel {
  padding: 13px 15px;
  border-top: 1px solid var(--line);
  background: linear-gradient(135deg,#f2fafb,#fff);
}

.assistantFinalPanel h3 {
  margin: 0;
}

.assistantFinalPanel p {
  margin: 5px 0 10px;
  color: var(--muted);
  font-size: .82rem;
  line-height: 1.45;
}

.assistantFinalActions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.assistantFinalActions .btn,.assistantFinalActions a {
  flex: 1 1 185px;
  text-align: center;
  text-decoration: none;
  font-size: .75rem;
  padding: 8px 10px;
}

.assistantPrivacyNote {
  font-size: .68rem;
  color: var(--muted);
  margin-top: 8px;
}

.srOnly {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@media (max-width:980px) {
  .assistantLayout {
    grid-template-columns: minmax(0,1fr);
  }
  .assistantSidebar {
    position: static;
    max-height: none;
  }
  .assistantAreas {
    display: flex;
    max-height: none;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0 0 4px;
  }
  .assistantArea {
    flex: 0 0 min(220px,76vw);
  }
  .assistantPanel {
    min-height: 720px;
  }
  .assistantMessages {
    max-height: none;
  }
}

@media (max-width:680px) {
  .appHeader {
    position: static;
  }
  .portalBadge {
    display: none;
  }
  .assistantLayout {
    gap: 12px;
  }
  .assistantPanel {
    min-height: 0;
    border-radius: 15px;
  }
  .assistantHeader {
    padding: 14px 12px;
  }
  .assistantHeader h2 {
    font-size: 1.18rem;
  }
  .assistantHeader p {
    font-size: .82rem;
  }
  .assistantData .formGrid {
    grid-template-columns: 1fr;
  }
  .assistantMessages {
    padding: 12px;
    gap: 8px;
    min-height: 320px;
  }
  .assistantBubble {
    max-width: 94%;
    padding: 9px 11px;
    font-size: .86rem;
  }
  .assistantBubble.user {
    max-width: 90%;
  }
  .assistantQuote {
    width: 100%;
    border-radius: 14px;
  }
  .assistantQuoteSummary {
    padding: 10px 11px;
  }
  .assistantQuoteSummary strong {
    font-size: 1.2rem;
  }
  .assistantQuoteBody {
    padding: 0 11px 11px;
  }
  .assistantContextGrid {
    grid-template-columns: 1fr;
  }
  .assistantQuoteActions {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .assistantQuoteActions button {
    width: 100%;
    white-space: normal;
  }
  .assistantFeedback {
    gap: 4px;
  }
  .assistantFeedback button {
    padding: 5px 7px;
  }
  .assistantSuggestions {
    padding: 8px 12px;
  }
  .assistantChip {
    max-width: 230px;
    font-size: .7rem;
  }
  .assistantComposer {
    padding: 10px 12px;
  }
  .assistantComposer textarea {
    min-height: 64px;
  }
  .assistantComposerMeta {
    display: block;
  }
  .assistantComposerMeta span:last-child {
    display: block;
    margin-top: 3px;
  }
  .assistantComposerActions {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .assistantComposerActions .btn:first-child {
    grid-column: 1/-1;
  }
  .assistantComposerActions .btn {
    width: 100%;
  }
  .assistantFinalActions {
    display: grid;
    grid-template-columns: 1fr;
  }
  .assistantFinalActions .btn,.assistantFinalActions a {
    width: 100%;
    flex: auto;
  }
  .roleChoice {
    min-height: 145px;
  }
}

@media (max-width:430px) {
  .assistantArea {
    flex-basis: min(200px,82vw);
  }
  .assistantQuoteActions {
    grid-template-columns: 1fr;
  }
  .assistantQuoteSummary {
    grid-template-columns: 1fr;
  }
  .assistantQuoteStatus {
    justify-self: start;
  }
  .assistantComposerActions {
    grid-template-columns: 1fr;
  }
  .assistantComposerActions .btn:first-child {
    grid-column: auto;
  }
}

@media (prefers-reduced-motion:reduce) {
  * {
    scroll-behavior: auto !important;
  }
  .assistantTypingDots i {
    animation: none;
  }
}

.assistantHeaderMeta {
  margin-top: 7px;

function complexityScore(p) {

    if (cond)
      score += n;
  };

  add(p.documentOrder === 'Disordinata', 18);
  add(p.documentOrder === 'Da recuperare da più portali/fonti', 28);
  add(p.lateDelivery === 'Sì', 10);
  add(p.foreign && p.foreign !== 'No', 12);
  add(p.intrastat === 'Sì', 8);
  add(toNumber(p.bankAccounts, 0) > 2, 8);
  add(toNumber(p.employees, 0) > 5, 8);
  add(p.arrears === 'Sì', 18);
  add(p.foreignCompanies === 'Sì', 15);
  add(p.consulting === 'Fino a 3 ore al mese', 10);
  add(p.consulting === 'Assistenza continuativa', 18);
  add(p.managementControl === 'Sì', 12);

  return clamp(score, 10, 100);
}

function importJson(file) {

  const reader = new FileReader();

    try {
      const x = validateImport(JSON.parse(reader.result));
      Object.assign(state, {
        selected: x.selected || {}, answers: x.answers || {}, commercial: x.commercial || {}, customServices: x.customServices || [], client: {
          ...state.client, ...(x.client || {}), vatStatus: x.client?.vatStatus || 'auto'
        }, manualStep: 0, presetName: '', globalIncrease: x.globalIncrease || state.globalIncrease, discount: x.discount || state.discount, view: 'manual'

    state.answers = {};
    state.commercial = {};
    state.customServices = [];

  }
  else if (t.id === 'switchManual') {
    state.view = 'manual';
    state.manualStep = 0;
    render();

    state.manualStep = clamp(Number(t.dataset.step), 0, 4);

  }

    state.manualStep = clamp(state.manualStep - 1, 0, 4);
