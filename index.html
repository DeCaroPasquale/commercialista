function inferPeriod(service){const t=(service.title+' '+(service.unit||'')).toLowerCase();if(service.id==='cedolini'||service.id.startsWith('forfettari_')||/annua|annuo|annuale|bilancio|dichiarazione|modello 770|certificazione unica|13ª|14ª|autoliquidazione|inail|contabilità/.test(t))return'annual';if(/mensile|mese|uniemens/.test(t))return'monthly';if(/trimestr/.test(t))return'quarterly';if(service.kind==='unitFixed'||service.kind==='unitRange'||/cadaun|per ogni|invio|pratica|rata|scadenza|richiesta/.test(t))return'consumption';return'oneoff'}

function isOpenQuote(q){return!q||q.min===null||q.value===null||q.max===null||/discrezione|manuale|valutare|concordare/i.test(String(q.warning||q.detail||''))}
function totals(){const items=selectedItems();let min=0,calc=0,max=0,proposedBase=0,open=false;const byPeriod={annual:0,monthly:0,quarterly:0,oneoff:0,consumption:0,custom:0};items.forEach(item=>{min+=item.quote.min||0;calc+=item.quote.value||0;max+=item.quote.max??item.quote.value??item.quote.min??0;if(isOpenQuote(item.quote)||item.proposed===null)open=true;if(item.proposed!==null){proposedBase+=item.proposed;byPeriod[item.commercial.period||'oneoff']=(byPeriod[item.commercial.period||'oneoff']||0)+item.proposed}});const increasePct=clamp(toNumber(state.globalIncrease.pct,12.5),0,12.5),increase=state.globalIncrease.enabled?Math.min(proposedBase*increasePct/100,2685):0,beforeDiscount=proposedBase+increase,discountPct=state.discount.enabled?clamp(toNumber(state.discount.pct,0),0,100):0,discount=beforeDiscount*discountPct/100,final=Math.max(0,beforeDiscount-discount),recurringBase=(byPeriod.annual||0)+(byPeriod.monthly||0)+(byPeriod.quarterly||0),followingIncrease=state.globalIncrease.enabled?Math.min(recurringBase*increasePct/100,2685):0,followingBeforeDiscount=recurringBase+followingIncrease,followingDiscount=followingBeforeDiscount*discountPct/100,followingYear=Math.max(0,followingBeforeDiscount-followingDiscount);return{items,min,calc,max,proposedBase,increasePct,increase,beforeDiscount,discountPct,discount,final,firstYear:final,recurringBase,followingYear,byPeriod,open,monthlyEquivalent:followingYear/12}}
function deviationReason(item){if(item.kind==='custom')return item.commercial.reason||'Prestazione aggiuntiva da valorizzare';const min=item.quote.min,proposed=item.proposed,max=item.quote.max;if(proposed===null)return'';if(min!==null&&proposed<min)return item.commercial.reason||'Importo inferiore al minimo: motivazione richiesta';if(max!==null&&proposed>max)return item.commercial.reason||'Importo superiore al massimo: motivazione richiesta';if(min!==null&&proposed===roundEuro(min))return'Applicato il minimo del listino';if(item.commercial.reason)return item.commercial.reason;const pct=min!==null&&max!==null&&max>min?Math.round((proposed-min)/(max-min)*100):null;return pct===null?'Importo determinato dal listino':`Posizionamento al ${clamp(pct,0,100)}% del range, in base alla complessità rilevata`}
const SUPPORTED_FORMULAS=new Set(['autoliquidazioneInail','bilanci','bonusEdilizia','cedolini','certificazioneUnica','collegioSindacale','contabilitaOrdinaria','contabilitaSemplificata','contributoFondoPerduto','copieSuccessione','creditiImpostaEsterno','creditoIvaEsterno','dichiarazioneIva','lettereIntento','maggiorazioneEdili','mensilita100','redditiTabella1','redditiTabella2','redditometro','registratoriPos','revisioneContabile','successione','uniemens']);
function auditCatalog(){const errors=[],warnings=[],ids=new Set();for(const section of sections){if(!section.id||!section.title)errors.push('Sezione senza ID o titolo.');for(const s of section.services||[]){if(ids.has(s.id))errors.push(`ID duplicato: ${s.id}`);ids.add(s.id);if(!s.id||!s.title||!s.kind)errors.push(`Prestazione incompleta in ${section.title}`);for(const key of['fixed','min','max'])if(typeof s[key]==='number'&&s[key]<0)errors.push(`${s.id}: valore negativo ${key}`);if(typeof s.min==='number'&&typeof s.max==='number'&&s.min>s.max)errors.push(`${s.id}: minimo superiore al massimo`);if(s.kind==='formula'&&!SUPPORTED_FORMULAS.has(s.formula))errors.push(`${s.id}: formula mancante/non supportata ${s.formula||''}`)}}for(const[name,rows]of Object.entries(tableRows||{})){let prev=null;for(let i=0;i<rows.length;i++){const r=rows[i];if(typeof r.min==='number'&&typeof r.max==='number'&&r.min>r.max)errors.push(`${name} riga ${i+1}: minimo > massimo`);if(prev!==null&&typeof r.from==='number'){const gap=r.from-prev;if(gap<0)errors.push(`${name} riga ${i+1}: sovrapposizione soglie`);else if(gap>.02)warnings.push(`${name} riga ${i+1}: possibile buco nelle soglie`)}if(typeof r.to==='number')prev=r.to}}return{ok:!errors.length,errors,warnings,summary:`${sections.length} sezioni · ${allServices.length} prestazioni · ${errors.length} errori · ${warnings.length} avvisi`}}
function readiness(){const audit=auditCatalog(),t=totals(),errors=[],warnings=[];if(LAST_SELF_TESTS&&LAST_SELF_TESTS.passed!==LAST_SELF_TESTS.total)errors.push(`Controlli automatici non superati: ${LAST_SELF_TESTS.passed}/${LAST_SELF_TESTS.total}.`);if(!audit.ok)errors.push(...audit.errors.slice(0,3));if(!t.items.length)errors.push('Seleziona almeno una prestazione.');const required=[['name','denominazione o nome'],['fiscalCode','codice fiscale'],['vatNumber','partita IVA'],['legalForm','forma giuridica']];required.forEach(([k,l])=>{if(!String(state.client[k]||'').trim())errors.push(`Manca ${l}.`)});t.items.forEach(item=>{if(item.proposed===null||!Number.isFinite(item.proposed)||item.proposed<=0)errors.push(`${item.service.title}: importo proposto non determinato.`);if(item.quote.max!==null&&item.proposed!==null&&item.proposed>item.quote.max&&!String(item.commercial.reason||'').trim())errors.push(`${item.service.title}: motivare il superamento del massimo.`);if(item.quote.min!==null&&item.proposed!==null&&item.proposed<item.quote.min&&!String(item.commercial.reason||'').trim())errors.push(`${item.service.title}: motivare l’importo sotto il minimo.`);if(isOpenQuote(item.quote))warnings.push(`${item.service.title}: voce discrezionale o manuale.`);if(!item.commercial.period)errors.push(`${item.service.title}: periodicità mancante.`)});if(state.discount.enabled&&toNumber(state.discount.pct,0)>0&&!state.discount.reason.trim())errors.push('Inserisci la motivazione dello sconto.');if(t.final<t.min&&state.discount.enabled&&!state.discount.reason.trim())errors.push('Il totale scende sotto il minimo: motivazione obbligatoria.');if(state.chat.started&&!state.chat.completed)warnings.push('La chat guidata non è stata completata.');return{ok:errors.length===0,errors,warnings,audit,totals:t}}

function normalize(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9€., ]/g,' ').replace(/\s+/g,' ').trim()}
function levenshtein(a,b){const m=Array.from({length:b.length+1},(_,i)=>[i]);for(let j=0;j<=a.length;j++)m[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)m[i][j]=a[j-1]===b[i-1]?m[i-1][j-1]:1+Math.min(m[i-1][j-1],m[i][j-1],m[i-1][j]);return m[b.length][a.length]}
function fuzzyHas(text,aliases){const n=normalize(text),tokens=n.split(' ');return aliases.some(alias=>{const a=normalize(alias);if(n.includes(a))return true;if(a.includes(' '))return false;return tokens.some(t=>t.length>2&&levenshtein(t,a)<=Math.max(1,Math.floor(a.length*.25)))})}
function parseAmountToken(raw){let s=String(raw).toLowerCase().replace(/€/g,'').trim(),mult=1;if(/milion/.test(s))mult=1000000;else if(/mila|\bk\b/.test(s))mult=1000;s=s.replace(/milioni?|mila|euro|k/g,'').trim();if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else s=s.replace(',','.');const n=Number(s);return Number.isFinite(n)?n*mult:null}
function parseInitialText(text){const n=normalize(text),p={raw:text};const forms=[['SRLS',['srls','s r l s']],['SRL',['srl','s r l','societa responsabilita limitata']],['SAS',['sas','s a s']],['SNC',['snc','s n c']],['SPA',['spa','s p a']],['Forfettario',['forfettario','forfetario','regime forfettario']],['Ditta individuale',['ditta individuale','impresa individuale']],['Professionista',['professionista','avvocato','medico','architetto','ingegnere']],['Persona fisica senza partita IVA',['persona fisica','senza partita iva']],['Società semplice',['societa semplice','ss']],['Cooperativa',['cooperativa']],['Condominio',['condominio']],['Associazione',['associazione']],['ETS',['ets','terzo settore']],['ASD/SSD',['asd','ssd','sportiva dilettantistica']],['Datore di lavoro domestico',['colf','badante','lavoro domestico']],['Successione',['successione','eredita']],['Revisione / Collegio sindacale',['revisione','collegio sindacale','sindaco unico']]];if(/\bsrls\b/.test(n))p.legalForm='SRLS';else if(/\bsrl\b/.test(n))p.legalForm='SRL';else if(/\bsas\b/.test(n))p.legalForm='SAS';else if(/\bsnc\b/.test(n))p.legalForm='SNC';else if(/\bspa\b/.test(n))p.legalForm='SPA';if(!p.legalForm){for(const[f,a]of forms)if(fuzzyHas(n,a)){p.legalForm=f;break}}const moneyMatches=[...n.matchAll(/(\d+(?:[.,]\d+)?)\s*(milioni?|mila|k|euro|€)?/g)].map(m=>({value:parseAmountToken(m[0]),index:m.index,raw:m[0]})).filter(x=>x.value!==null);const near=(word,x)=>Math.abs(n.indexOf(word)-x.index)<35;const turnover=moneyMatches.find(x=>x.value>=1000&&(near('fattur',x)||near('ricav',x)))||moneyMatches.find(x=>x.value>=10000);if(turnover)p.turnover=turnover.value;const dip=n.match(/(\d+|un|uno|una|due|tre|quattro|cinque|sei|sette|otto|nove|dieci)\s*(dipendent|dipendete|dip)/);if(dip){const words={un:1,uno:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10};p.employees=words[dip[1]]||Number(dip[1]);}const mov=n.match(/(\d+)\s*(moviment|registraz|articol)/);if(mov)p.movements=Number(mov[1]);const fatt=n.match(/(\d+)\s*(fattur)/);if(fatt)p.invoicesTotal=Number(fatt[1]);if(fuzzyHas(n,['ordinaria','partita doppia']))p.accounting='Ordinaria';if(fuzzyHas(n,['semplificata']))p.accounting='Semplificata';if(fuzzyHas(n,['operazioni estere','estero','intra']))p.foreign='Sì';return p}
function baseQuestions(profile){const business=!['Persona fisica senza partita IVA','Successione','Revisione / Collegio sindacale','Datore di lavoro domestico'].includes(profile.legalForm);const q=[];if(!profile.legalForm)q.push({key:'legalForm',label:'Qual è la forma giuridica?',type:'select',options:LEGAL_FORMS});if(business){if(!profile.sector)q.push({key:'sector',label:'Qual è il settore di attività?',type:'text'});if(profile.turnover===undefined)q.push({key:'turnover',label:'Qual è il fatturato annuo?',type:'number'});if(profile.assets===undefined)q.push({key:'assets',label:'Qual è indicativamente l’attivo patrimoniale?',type:'number',optional:true});if(!profile.accounting)q.push({key:'accounting',label:'Quale contabilità occorre?',type:'select',options:['Forfettaria','Semplificata','Ordinaria','Da determinare']});if(profile.invoicesActive===undefined)q.push({key:'invoicesActive',label:'Quante fatture attive annue?',type:'number'});if(profile.invoicesPassive===undefined)q.push({key:'invoicesPassive',label:'Quante fatture passive annue?',type:'number'});if(profile.movements===undefined)q.push({key:'movements',label:'Quanti movimenti contabili annui?',type:'number',optional:true});if(profile.bankAccounts===undefined)q.push({key:'bankAccounts',label:'Quanti conti correnti utilizza?',type:'number'});if(profile.employees===undefined)q.push({key:'employees',label:'Quanti dipendenti ha?',type:'number'});q.push({key:'vatPeriod',label:'Periodicità IVA?',type:'select',options:['Mensile','Trimestrale','Non applicabile','Da verificare']},{key:'foreign',label:'Sono presenti operazioni estere?',type:'select',options:['No','Sì, occasionali','Sì, ricorrenti']},{key:'intrastat',label:'Occorre gestire Intrastat?',type:'select',options:['No','Sì','Da verificare']},{key:'withholding',label:'Ci sono ritenute e Certificazioni Uniche?',type:'select',options:['No','Sì, solo professionisti','Sì, dipendenti','Entrambe']},{key:'f24Count',label:'Quanti F24 saranno gestiti in un anno?',typ function complexityScore(p){let score=25;const add=(cond,n)=>{if(cond)score+=n};add(p.documentOrder==='Abbastanza ordinata',8);add(p.documentOrder==='Disordinata',18);add(p.documentOrder==='Da recuperare da più portali/fonti',28);add(p.lateDelivery==='Sì',10);add(p.foreign&&p.foreign!=='No',12);add(p.intrastat==='Sì',8);add(toNumber(p.bankAccounts,0)>2,8);add(toNumber(p.employees,0)>5,8);add(p.arrears==='Sì',18);add(p.foreignCompanies==='Sì',15);add(p.consulting==='Fino a 3 ore al mese',10);add(p.consulting==='Assistenza continuativa',18);add(p.managementControl==='Sì',12);score+=(p.complexityFlags||[]).length*6;return clamp(score,10,100)}

function runSelfTests(log=true){const results=[],test=(name,fn)=>{try{results.push({name,ok:!!fn()})}catch(e){results.push({name,ok:false,error:e.message})}};test('Catalogo integro',()=>auditCatalog().ok);test('ID univoci',()=>new Set(allServices.map(s=>s.id)).size===allServices.length);test('Formule supportate',()=>allServices.filter(s=>s.kind==='formula').every(s=>SUPPORTED_FORMULAS.has(s.formula)));test('Contabilità semplificata minima',()=>roundEuro(calculate(serviceById.cont_semplificata,{fatture:90,level:0}).value)===1192);test('Contabilità ordinaria 700',()=>roundEuro(calculate(serviceById.cont_ordinaria,{articoli:700,level:100}).value)===2800);test('Cedolini 3 x 12',()=>roundEuro(calculate(serviceById.cedolini,{dipendenti:3,mesi:12}).value)===1896);test('Dichiarazione IVA soglia',()=>roundEuro(calculate(serviceById.dich_iva,{volume:75000.01,level:0}).value)===240);test('Credito IVA minimo',()=>roundEuro(calculate(serviceById.cert_credito_iva_esterno,{credito:10000}).value)===265);test('Revisione oltre soglia aperta',()=>calculate(serviceById.revisione_contabile,{fatturato:60000000,attivo:60000000}).value===null);test('Bonus edilizia',()=>roundEuro(calculate(serviceById.visto_bonus_edilizia,{valore:200000,level:50}).value)===4000);test('Parser SRL con refuso',()=>parseInitialText('srl da 80.000 con un dipendete').legalForm==='SRL');test('Parser fatturato',()=>parseInitialText('srl fatturato 80 mila').turnover===80000);test('Parser dipendenti',()=>parseInitialText('srl con 3 dipendenti').employees===3);test('Maggiorazione solo proposto',()=>{const old={...state.globalIncrease};state.globalIncrease={enabled:true,pct:12.5};const inc=totals().increase;state.globalIncrease=old;return inc>=0});test('Sconto massimo 100%',()=>clamp(150,0,100)===100);test('Privacy chat non esportata',()=>!('chat' in quotePayload()));test('Salvataggio richiede consenso',()=>state.saveConsent===false||typeof state.saveConsent==='boolean');test('Periodicità disponibili',()=>Object.keys(PERIODS).length===6);test('Stampa finale bloccabile',()=>typeof readiness().ok==='boolean');test('Chat produce domande',()=>baseQuestions({legalForm:'SRL'}).length>10);test('Listino completo 133 prestazioni',()=>allServices.length===133);test('Forfettario range invariato',()=>{const q=calculate(serviceById.forfettari_fino_10,{qty:1,level:50});return q.min===510&&q.max===1220});test('Forfettario classificato annuale',()=>inferPeriod(serviceById.forfettari_fino_10)==='annual');test('Uniemens annuale 1 dipendente',()=>calculate(serviceById.uniemens,{nominativi:1,modelli:12}).value===528);test('Dicitura oneri di legge presente',()=>DEFAULT_CONDITIONS.charges.toLowerCase().includes('oltre oneri previsti per legge'));if(log)console.table(results);return{passed:results.filter(x=>x.ok).length,total:results.length,results}}
function resetAll(){Object.assign(state,{view:'welcome',mode:'internal',query:'',selected:{},answers:{},commercial:{},customServices:[],openSections:{},client:{name:'',fiscalCode:'',vatNumber:'',legalForm:'',sector:'',address:'',email:'',contact:'',quoteDate:new Date().toISOString().slice(0,10),paymentMode:'Mensile anticipato',customPayment:'',notes:'',validDays:10,conditions:{...DEFAULT_CONDITIONS}},globalIncrease:{enabled:false,pct:12.5},discount:{enabled:false,pct:0,reason:''},saveConsent:false,chat:{messages:[],profile:{},questions:[],index:0,started:false,completed:false,uncertain:[]}});render()}
document.addEventListener('click',e=>{const t=e.target.closest?.('button')||e.target;if(t.id==='startChat'){state.view='chat';render()}else if(t.id==='startManual'){state.view='manual';render()}else if(t.id==='backWelcome'){state.view='welcome';render()}else if(t.id==='newQuote'){if(confirm('Creare un nuovo preventivo? I dati non salvati andranno persi.'))resetAll()}else if(t.classList.contains('modeBtn')){state.mode=t.dataset.mode;render()}else if(t.id==='analyzeChat'){const text=document.getElementById('chatInitial').value.trim();if(!text)return toast('Descrivi prima il cliente.');const p=parseInitialText(text);state.chat={messages:[{role:'user',text},{role:'bot',text:'Ho analizzato la richiesta. Ora raccolgo le informazioni mancanti necessarie per una stima corretta.'}],profile:p,questions:[],index:0,started:true,completed:false,uncertain:[]};state.chat.questions=baseQuestions(p);if(!state.chat.questions.length){applyProfile(p);state.chat.completed=true}render()}else if(t.id==='submitChatBatch'){updateChatInputs();state.chat.index+=4;if(state.chat.index>=state.chat.questions.length){applyProfile(state.chat.profile);state.chat.messages.push({role:'bot',text:`Ho elaborato la proposta usando il listino. Complessità stimata: ${complexityScore(state.chat.profile)}%. Controlla dati, prestazioni e voci ancora incerte.`})}render()}else if(t.id==='applyChat'){state.view='manual';state.mode='internal';render();toast('Proposta della chat applicata. Completa i dati cliente e verifica gli importi.')}else if(t.id==='resetChat'){state.chat={messages:[],profile:{},questions:[],index:0,started:false,completed:false,uncertain:[]};state.selected={};state.answers={};state.commercial={};state.customServices=[];render()}else if(t.id==='switchManual'){state.view='manual';render()}else if(t.id==='openAll'){sections.forEach(s=>state.openSections[s.id]=true);render()}else if(t.id==='closeAll'){state.openSections={};render()}else if(t.id==='addCustom'){state.customServices.push({id:'custom   function tokenSimilarity(a,b){
    if(a===b) return 1;
    if(a.length<3||b.length<3) return 0;
    const distance=levenshtein(a,b);
    return distance<=1?0.85:distance<=Math.max(1,Math.floor(Math.max(a.length,b.length)*0.22))?0.55:0;
  }

  function phraseScore(text, phrase){
    const a=normalize(text), b=normalize(phrase);
    if(!a||!b) return 0;
    if(a.includes(b)) return 15 + b.split(' ').length;
    const at=a.split(' ').filter(x=>x.length>2), bt=b.split(' ').filter(x=>x.length>2);
    let score=0;
    bt.forEach(target=>{score+=Math.max(0,...at.map(word=>tokenSimilarity(word,target)));});
    return score/Math.max(1,bt.length)*8;
  }

  function findIntent(text){
    const ranked=INTENTS.map(intent=>({intent, score:Math.max(...intent.keys.map(key=>phraseScore(text,key)))}))
      .sort((a,b)=>b.score-a.score);
    if(ranked[0] && ranked[0].score>=4.1) return ranked[0].intent;

    const example=allQuestionExamples.map(item=>({...item,score:phraseScore(text,item.question)})).sort((a,b)=>b.score-a.score)[0];
    if(example && example.score>=5){
      const technical=INTENTS.find(x=>x.id==='technical');
      return {...technical, category:example.title};
    }
    return null;
  }

  function addClientMessage(role,text,opts={}){
    state.clientConversation.messages.push({

  function startFollowUp(intent){
    state.clientConversation.pending={step:intent.follow, context:{...(intent.context||{})}, intentId:intent.id, originalQuestion:state.clientConversation.lastQuestion};
    state.clientConversation.lastIntent=intent.id;
    if(intent.intro) addClientMessage('bot',intent.intro,{question:state.clientConversation.lastQuestion});
    const flow=FOLLOW_UPS[intent.follow];
    addClientMessage('bot',flow.prompt,{question:state.clientConversation.lastQuestion});
  }

  function handleFollowUp(answer){
    const pending=state.clientConversation.pending;
    if(!pending) return false;
    const flow=FOLLOW_UPS[pending.step];
    if(flow.carry) pending.context[flow.carry]=answer;
    let result=flow.resolve?flow.resolve(answer,pending.context):null;
    const outcome=typeof result==='string'?{text:result}:result;
    if(outcome?.context) Object.assign(pending.context,outcome.context);
    if(outcome?.text){
      const needsContact=outcome.contact||/valutazione dello Studio|approvata dallo Studio|inoltrare/.test(outcome.text);
      addClientMessage('bot',outcome.text,{contact:needsContact,question:pending.originalQuestion||state.clientConversation.lastQuestion,estimateItems:outcome.estimateItems});
    }
    if(outcome?.repeat) return true;
    const next=outcome?.next ?? (typeof flow.next==='function'?flow.next(answer,pending.context):flow.next);
    if(next){
      pending.step=next;
      const newFlow=FOLLOW_UPS[next];
      addClientMessage('bot',newFlow.prompt,{question:pending.originalQuestion||state.clientConversation.lastQuestion});
    }else{
      state.clientConversation.lastIntent=pending.intentId||state.clientConversation.lastIntent;
      state.clientConversation.pending=null;
    }
    return true;
  }

  function contextualIntent(question){
    const n=normalize(question);
    const last=state.clientConversation.lastIntent;
    const annual=/all anno|annuale|annuo|mantenimento|gestione dell anno|gestione annuale|costo fisso|quanto prendi/.test(n);
    const affirmative=/^(si|sì|ok|va bene|procedi|continua|fammi il preventivo)$/.test(question.trim().toLowerCase());
    if(last==='srl_constitution'&&(annual||affirmative)) return INTENTS.find(x=>x.id==='srl_annual');
    return null;
  }

  function answerClientQuestion(text){
    const question=text.trim();
    if(!question) return;
    state.clientEstimate=null;
    state.clientConversation.lastQuestion=question;
    addClientMessage('user',question);

    if(handleFollowUp(question)) return;

    const intent=contextualIntent(question)||findIntent(question);
    if(!intent){
      addClientMessage('bot','Ho capito l’argomento, ma non ho una regola abbastanza precisa per dare una risposta affidabile. Posso inoltrare la domanda a Pasquale De Caro, già compilata con il testo che hai scritto.',{contact:true,question});
      return;
    }
    state.clientConversation.lastIntent=intent.id;
    if(intent.type==='guided'){
      startFollowUp(intent);
      return;
    }
    addClientMessage('bot',intent.answer,{contact:intent.contact||intent.type==='technical',question});
  }

  function parseEuroValues(text){
    const values=[];
    const regex=/€\s*([0-9][0-9.]*?(?:,[0-9]{1,2})?)(?=\s|\.|,|;|$)/g;
    let match;
    while((match=regex.exec(text||''))){
      const value=Number(match[1].replace(/\./g,'').replace(',','.'));
      if(Number.isFinite(value)) values.push(value);
    }
    return values;
  }

  function collectClientEstimateItems(){
    const items=[],seen=new Set();
    const add=item=>{
      if(!item) return;
      const key=item.key||`${item.title}|${item.priceText}`;
      if(seen.has(key)) return;
      seen.add(key);items.push(item);
    };
    state.clientConversation.messages.forEach(message=>{
      if(message.role!=='bot') return;
      if(Array.isArray(message.estimateItems)) message.estimateItems.forEach(add);
      else add(estimateItemFromMessage(message));
    });
    return items;
  }

    const followOptions=new Set(Object.values(FOLLOW_UPS).flatMap(flow=>flow.options||[]));

  function inferConversationArea(){
    const counts={};
    clientQuestions().forEach(question=>{
      const best=allQuestionExamples.map(item=>({...item,score:phraseScore(question,item.question)})).sort((a,b)=>b.score-a.score)[0];
      if(best&&best.score>=5) counts[best.category]=(counts[best.category]||0)+1;
    });
    const categoryId=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||state.clientArea;
    return (QUESTION_CATEGORIES.find(c=>c.id===categoryId)||{}).title||categoryId||'Non specificata';
  }

  function createClientEstimate(){
    const items=collectClientEstimateItems();
    const calculable=items.filter(item=>Number.isFinite(item.annualAmount));
    const individualTotal=calculable.reduce((sum,item)=>sum+item.annualAmount,0);
    const hasOpenItems=items.some(item=>!Number.isFinite(item.annualAmount));
    const discountable=calculable.filter(item=>item.annualAmount>0&&item.discountEligible!==false);
    const nonDiscountable=calculable.filter(item=>item.annualAmount>0&&item.discountEligible===false);
    const packageEligible=discountable.length>=2;
    const packageTotal=packageEligible?Math.round((nonDiscountable.reduce((sum,item)=>sum+item.annualAmount,0)+discountable.reduce((sum,item)=>sum+item.annualAmount,0)*.8)*100)/100:null;
    state.clientEstimate={
      createdAt:new Date().toISOString(),items,individualTotal,packageTotal,hasOpenItems,
      questions:clientQuestions(),area:inferConversationArea()
    };
    return state.clientEstimate;
  }

  function pdfAscii(text){
    return String(text).replace(/€/g,'EUR').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E\n]/g,' ');
  }
  function wrapPdfLine(text,max=88){
    const words=pdfAscii(text).split(/\s+/),out=[];let line='';
    words.forEach(word=>{const next=line?`${line} ${word}`:word;if(next.length>max&&line){out.push(line);line=word;}else line=next;});
    if(line)out.push(line);return out.length?out:[''];
  }
  function escapePdf(text){return text.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');}
  function makePdfBlob(text){
    const raw=[];pdfAscii(text).split('\n').forEach(line=>raw.push(...wrapPdfLine(line),''));
    const linesPerPage=48,pages=[];for(let i=0;i<raw.length;i+=linesPerPage)pages.push(raw.slice(i,i+linesPerPage));
    const pageCount=Math.max(1,pages.length),objects=[];
    objects[1]='<< /Type /Catalog /Pages 2 0 R >>';
    const kids=[];for(let i=0;i<pageCount;i++)kids.push(`${4+i*2} 0 R`);
    objects[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pageCount} >>`;
    objects[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
    for(let i=0;i<pageCount;i++){
      const pageId=4+i*2,contentId=5+i*2;
      const content=`BT\n/F1 10 Tf\n50 790 Td\n14 TL\n${(pages[i]||['']).map(line=>`(${escapePdf(line)}) Tj\nT*`).join('\n')}\nET`;
      objects[pageId]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentId} 0 R >>`;
      objects[contentId]=`<< /Length ${content.length} >>\nstream\n${content}\nendstream`;
    }
    let pdf='%PDF-1.4\n',offsets=[0];
    for(let i=1;i<objects.length;i++){offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`;}
    const xref=pdf.length;pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;
    for(let i=1;i<objects.length;i++)pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;
    pdf+=`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    return new Blob([pdf],{type:'application/pdf'});
  }

    const est=ensureClientEstimate(),d=state.clientData;
    const items=est.items.length?est.items.map(item=>`<div class="printItem"><div class="printItemTop"><h3>${h(item.title)}</h3><div class="printPrice">${h(item.priceText)}</div></div><p>${h(item.note||'')}</p></div>`).join(''):'<p>Nessuna voce economica determinabile automaticamente.</p>';
    document.getElementById('printRoot').innerHTML=`<div class="printDoc"><div class="printHeader"><div><p>Studio De Caro</p><h1>Stima preliminare</h1><p>Documento da validare dallo Studio</p></div><div class="printLogo">DC</div></div><div class="printSection"><h2>Dati del cliente</h2><div class="printInfoGrid"><div class="printInfo"><span>Cliente</span><strong>${h(clientLabel(d.name))}</strong></div><div class="printInfo"><span>Email</span><strong>${h(clientLabel(d.email))}</strong></div><div class="printInfo"><span>Telefono</span><strong>${h(clientLabel(d.phone))}</strong></div><div class="printInfo"><span>Situazione</span><strong>${h(clientLabel(d.legalForm))}</strong></div><div class="printInfo"><span>Area</span><strong>${h(est.area)}</strong></div><div class="printInfo"><span>Data</span><strong>${h(new Date(est.createdAt).toLocaleDateString('it-IT'))}</strong></div></div></div><div class="printSection"><h2>Prestazioni e stime</h2>${items}${est.individualTotal>0?`<div class="printTotal"><span>Totale minimo provvisorio delle voci calcolabili</span><strong>${money(est.individualTotal)}</strong></div>`:''}${est.packageTotal!==null?`<p><strong>Ipotesi pacchetto con sconto iniziale del 20%: ${money(est.packageTotal)}</strong></p>`:''}</div><div class="printSection"><h2>Richieste del cliente</h2>${est.questions.map(q=>`<div class="printCondition">${h(q)}</div>`).join('')}</div><div class="printSection"><h2>Condizioni</h2>${estimateConditionsText().map(x=>`<div class="printCondition">${h(x)}</div>`).join('')}<p><strong>Il documento è una stima preliminare e non costituisce un preventivo definitivo.</strong></p></div><div class="printFooter">Studio De Caro · Stima generata localmente nel browser</div></div>`;
    window.print();
  }

  function roleView(){
    return `<section class="welcome portalWelcome"><div class="welcomeCard">
      <span class="kicker">Studio De Caro</span>
      <h2>Come desideri utilizzare il servizio?</h2>
      <p class="lead">Scegli il percorso più adatto. Il cliente accede alla chat; il consulente può usare sia la chat sia il preventivatore manuale.</p>
      <div class="choiceGrid roleGrid">
        <button class="choice roleChoice" id="chooseClient"><span class="roleIcon" aria-hidden="true">👤</span><strong>Sono un cliente</strong><span>Vorrei fare una domanda, capire quali servizi mi servono o ricevere una prima stima.</span></button>
        <button class="choice roleChoice" id="chooseConsultant"><span class="roleIcon" aria-hidden="true">🧑‍💼</span><strong>Sono un consulente</strong><span>Vorrei costruire o verificare un preventivo professionale.</span></button>
      </div>
    </div></section>`;
  }

  function clientChoiceView(){
    return `<section class="welcome portalWelcome"><div class="welcomeCard compactWelcome">
      <span class="kicker">Percorso cliente</span>
      <h2>Come preferisci proseguire?</h2>
      <p class="lead">Puoi utilizzare la chat scritta oppure parlare con l’avatar digitale di Pasquale De Caro.</p>
      <div class="choiceGrid">
        <button class="choice roleChoice" id="continueClientChat"><span class="roleIcon" aria-hidden="true">💬</span><strong>Continua con la chat</strong><span>Fai domande, inserisci i dati utili e ricevi una prima informazione o stima.</span></button>
        <a class="choice roleChoice choiceLink" href="${CONTACT.avatar}" target="_blank" rel="noopener"><span class="roleIcon" aria-hidden="true">🎥</span><strong>Parla con l’avatar di Pasquale De Caro</strong><span>Apri l’assistente digitale in una nuova scheda.</span></a>
      </div>
      <button class="btn light portalBack" id="portalBackRole">Torna alla scelta iniziale</button>
    </div></section>`;
  }

  function consultantLoginView(){
    return `<section class="welcome portalWelcome"><div class="welcomeCard passwordCard">
      <span class="kicker">Area riservata</span><h2>Accesso consulente</h2>
      <p class="lead">Inserisci la password per accedere alla chat professionale e al preventivatore manuale.</p>
      <form id="consultantLoginForm" class="passwordForm">
        <label class="field"><span>Password</span><input id="consultantPassword" type="password" autocomplete="current-password" aria-describedby="passwordHelp" autofocus></label>
        <small id="passwordHelp" class="help">Accesso riservato agli addetti ai lavori.</small>
        ${state.consultantLoginError?`<div class="gate bad" role="alert">${h(state.consultantLoginError)}</div>`:''}
        <div class="toolbar"><button class="btn" type="submit">Accedi</button><button class="btn light" type="button" id="portalBackRole">Indietro</button></div>
      </form>
    </div></section>`;
  }

  function consultantHomeView(){
    return `<section class="welcome portalWelcome"><div class="welcomeCard">
      <span class="kicker">Area consulente</span><h2>Come vuoi lavorare?</h2>
      <p class="lead">Puoi descrivere il caso con linguaggio naturale oppure compilare direttamente il listino completo.</p>
      <div class="choiceGrid">
        <button class="choice roleChoice" id="consultantStartChat"><span class="roleIcon" aria-hidden="true">💬</span><strong>Chat professionale</strong><span>Raccoglie i dati mancanti e propone le prestazioni del prontuario.</span></button>
        <button class="choice roleChoice" id="consultantStartManual"><span class="roleIcon" aria-hidden="true">🧮</span><strong>Preventivo manuale</strong><span>Accedi al catalogo completo, alle formule e alle condizioni commerciali.</span></button>
      </div>
      <button class="btn light portalBack" id="consultantLogout">Esci dall’area consulente</button>
    </div></section>`;
  }

  function clientDataHtml(){
    const d=state.clientData;
    return `<details class="clientDataBox"><summary>Dati facoltativi del cliente</summary><div class="formGrid" style="margin-top:12px">
      <label class="field"><span>Nome e cognome</span><input class="clientPortalInput" data-key="name" value="${h(d.name)}" autocomplete="name"></label>
      <label class="field"><span>Email</span><input class="clientPortalInput" data-key="email" type="email" value="${h(d.email)}" autocomplete="email"></label>
      <label class="field"><span>Telefono</span><input class="clientPortalInput" data-key="phone" value="${h(d.phone)}" autocomplete="tel"></label>
      <label class="field"><span>Forma giuridica o situazione</span><input class="clientPortalInput" data-key="legalForm" value="${h(d.legalForm)}" placeholder="Es. forfettario, SRL, persona fisica"></label>
    </div><small class="help">I dati restano nel browser e vengono inseriti nei messaggi di contatto solo se decidi di inviarli.</small></details>`;
  }

  function suggestionChips(){
    const area=QUESTION_CATEGORIES.find(x=>x.id===state.clientArea) || QUESTION_CATEGORIES[0];
    return area.questions.slice(0,5).map(q=>`<button class="suggestionChip" data-question="${h(q)}">${h(q)}</button>`).join('');
  }

  function pendingInputHtml(){
    const pending=state.clientConversation.pending;
    if(!pending) return '';
    const flow=FOLLOW_UPS[pending.step];
    if(flow.options) return `<div class="followOptions">${flow.options.map(option=>`<button class="btn soft followAnswer" data-answer="${h(option)}">${h(option)}</button>`).join('')}</div>`;
    return '';
  }

  function clientChatView(){
    if(!state.clientConversation.messages.length){
      addClientMessage('bot','Hai una domanda specifica oppure desideri capire quali servizi e costi potrebbero riguardarti?');
    }
    return `<div class="clientChatLayout">
      <aside class="clientSidebar panel" aria-label="Aree disponibili">
        <div class="panelHead"><div><h3>Area di riferimento</h3><p>Scegli un tema oppure scrivi liberamente.</p></div></div>
        <div class="panelBody areaList">${QUESTION_CATEGORIES.map(c=>`<button class="areaButton ${state.clientArea===c.id?'active':''}" data-area="${c.id}"><span>${c.icon}</span>${h(c.title)}<small>${c.questions.length} domande</small></button>`).join('')}</div>
      </aside>
      <section class="panel clientChatPanel">
        <div class="chatHeader"><div><h2>Chat Studio De Caro</h2><p>Informazioni, stime iniziali e contatto diretto con Pasquale De Caro.</p></div>${clientDataHtml()}</div>
        <div class="messages clientMessages" id="clientMessages" aria-live="polite">${state.clientConversation.messages.map(m=>`<div class="bubble ${m.role}">${h(m.text)}${m.contact?contactActionsHtml(m.question):''}</div>`).join('')}${pendingInputHtml()}</div>
        <div class="clientSuggestions"><span>Domande frequenti:</span><div class="chipRow">${suggestionChips()}</div></div>
        ${estimatePanelHtml()}
        <form class="chatComposer clientComposer" id="clientChatForm">
          <label class="srOnly" for="clientChatInput">Scrivi la tua domanda</label>
          <textarea id="clientChatInput" placeholder="Scrivi la tua domanda, anche con parole semplici o errori…" required></textarea>
          <div class="toolbar"><button class="btn" type="submit">Invia</button><button class="btn light" type="button" id="resetClientChat">Nuova conversazione</button><button class="btn light" type="button" id="backClientChoice">Indietro</button></div>
        </form>
      </section>
    </div>`;
  }

  function portalHeader(){
    const actions=document.getElementById('headActions');
    if(state.portalView==='role') return actions.innerHTML='';
    if(state.portalRole==='client'){
      actions.innerHTML=`<span class="portalBadge">Percorso cliente</span><button class="btn light" id="portalBackRole">Cambia profilo</button>`;
      return;
    }
    if(state.portalRole==='consultant' && state.consultantUnlocked){
      const legacy=state.portalView==='legacy';
      actions.innerHTML=`<span class="portalBadge">Area consulente</span>${legacy?`<button class="btn light" id="consultantHome">Chat / Manuale</button>`:''}<button class="btn light" id="consultantLogout">Esci</button>`;
      return;
    }
    actions.innerHTML='<button class="btn light" id="portalBackRole">Indietro</button>';
  }

  conditionsHtml = function(){
    const c=state.client.conditions;
    const labels={validity:'Validità dell’offerta',charges:'Oneri di legge',payment:'Modalità di pagamento',withdrawal:'Recesso durante l’anno',urgency:'Prestazioni urgenti',handover:'Restituzione documenti',retention:'Conservazione dati e documenti',istat:'Adeguamento ISTAT',exclusions:'Esclusioni',lateDocs:'Documentazione tardiva/incompleta',privacy:'Privacy'};
    return `<div class="formGrid">${Object.entries(labels).map(([k,l])=>`<label class="field full"><span>${l}</span><textarea class="conditionInput" data-key="${k}">${h(c[k]||'')}</textarea></label>`).join('')}</div>`;
  };

  renderHeader = portalHeader;
  render = function(){
    portalHeader();
    const app=document.getElementById('app');
    if(state.portalView==='role') app.innerHTML=roleView();
    else if(state.portalView==='client-choice') app.innerHTML=clientChoiceView();
    else if(state.portalView==='client-chat') app.innerHTML=clientChatView();
    else if(state.portalView==='consultant-login') app.innerHTML=consultantLoginView();
    else if(state.portalView==='consultant-home') app.innerHTML=consultantHomeView();
    else if(state.portalView==='legacy'){
      app.innerHTML=state.mode==='client'&&state.view!=='welcome'?legacyClientView():state.view==='chat'?legacyChatView():legacyManualView();
    }
    requestAnimationFrame(()=>{
      const m=document.getElementById('clientMessages')||document.getElementById('messages');
      if(m)m.scrollTop=m.scrollHeight;
    });
  };

  resetAll = function(){
    Object.assign(state,{
      view:'welcome', mode:'internal', query:'', selected:{}, answers:{}, commercial:{}, customServices:[], openSections:{},
      client:{name:'',fiscalCode:'',vatNumber:'',legalForm:'',sector:'',address:'',email:'',contact:'',quoteDate:new Date().toISOString().slice(0,10),paymentMode:'Trimestrale',customPayment:'',notes:'',validDays:15,conditions:{...DEFAULT_CONDITIONS}},
      globalIncrease:{enabled:false,pct:12.5}, discount:{enabled:false,pct:0,reason:''}, saveConsent:false,
      chat:{messages:[],profile:{},questions:[],index:0,started:false,completed:false,uncertain:[]},
      portalRole:null, portalView:'role', consultantUnlocked:false, consultantLoginError:'',
      clientArea:'avvio', clientData:{name:'',email:'',phone:'',legalForm:''},
      clientConversation:{messages:[],lastQuestion:'',lastIntent:'',pending:null}, clientEstimate:null
    });
    render();
  };

  document.addEventListener('submit',event=>{
    if(event.target.id==='consultantLoginForm'){
      event.preventDefault(); event.stopImmediatePropagation();
      const password=document.getElementById('consultantPassword')?.value||'';
      if(password==='123'){
        state.consultantUnlocked=true; state.consultantLoginError=''; state.portalView='consultant-home'; render();
      }else{
        state.consultantLoginError='Password non corretta.'; render();
      }
    }
    if(event.target.id==='clientChatForm'){
      event.preventDefault(); event.stopImmediatePropagation();
      const input=document.getElementById('clientChatInput');
      answerClientQuestion(input?.value||'');
      render();
    }
  },true);

  document.addEventListener('click',event=>{
    const target=event.target.closest('button, a');
    if(!target) return;
    const id=target.id;
    const handled=['chooseClient','chooseConsultant','portalBackRole','continueClientChat','consultantStartChat','consultantStartManual','consultantLogout','consultantHome','resetClientChat','backClientChoice','backWelcome','buildClientEstimate','downloadEstimatePdf','printClientEstimate'];
    if(handled.includes(id) || target.classList.contains('areaButton') || target.classList.contains('suggestionChip') || target.classList.contains('followAnswer')){
      event.preventDefault(); event.stopImmediatePropagation();
    }
    if(id==='chooseClient'){
      state.portalRole='client'; state.portalView='client-choice'; render();
    }else if(id==='chooseConsultant'){
      state.portalRole='consultant'; state.portalView='consultant-login'; render();
    }else if(id==='portalBackRole'){
      state.portalRole=null; state.portalView='role'; state.consultantUnlocked=false; render();
    }else if(id==='continueClientChat'){
      state.portalRole='client'; state.portalView='client-chat'; state.clientArea='avvio'; render();
    }else if(id==='consultantStartChat'){
      state.portalView='legacy'; state.view='chat'; state.mode='internal'; render();
    }else if(id==='consultantStartManual'){
      state.portalView='legacy'; state.view='manual'; state.mode='internal'; render();
    }else if(id==='consultantHome'){
      state.portalView='consultant-home'; render();
    }else if(id==='consultantLogout'){
      state.consultantUnlocked=false; state.portalRole=null; state.portalView='role'; render();
    }else if(id==='resetClientChat'){
      state.clientConversation={messages:[],lastQuestion:'',lastIntent:'',pending:null}; state.clientEstimate=null; render();
    }else if(id==='buildClientEstimate'){
      createClientEstimate(); render(); requestAnimationFrame(()=>document.querySelector('.estimateCard')?.scrollIntoView({behavior:'smooth',block:'nearest'}));
    }else if(id==='sendEstimateEmail'){
      target.href=estimateEmailUrl();
    }else if(id==='sendEstimateWhatsapp'){
      target.href=estimateWhatsappUrl();
    }else if(id==='downloadEstimatePdf'){
      downloadClientEstimatePdf();
    }else if(id==='printClientEstimate'){
      printClientEstimate();
    }else if(id==='backClientChoice'){
      state.portalView='client-choice'; render();
    }else if(id==='backWelcome' && state.portalRole==='consultant'){
      state.portalView='consultant-home'; state.view='welcome'; render();
    }else if(target.classList.contains('areaButton')){
      state.clientArea=target.dataset.area; render();
    }else if(target.classList.contains('suggestionChip')){
      answerClientQuestion(target.dataset.question||target.textContent); render();
    }else if(target.classList.contains('followAnswer')){
      const answer=target.dataset.answer||target.textContent;
      state.clientEstimate=null;
      addClientMessage('user',answer);
      handleFollowUp(answer); render();
    }
  },true);

  document.addEventListener('change',event=>{
    const target=event.target;
    if(target.classList.contains('clientPortalInput')){
      state.clientData[target.dataset.key]=target.value;
      if(state.clientEstimate) state.clientEstimate=createClientEstimate();
    }
  },true);

  window.studioDeCaroFAQ={categories:QUESTION_CATEGORIES,intents:INTENTS,findIntent};
  render();
})();

</script>
</body>
</html>
